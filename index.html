<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chat with your notes</title>


    <style>
        :root {
            --bg: #0f1116; 
            --bg2: #1a1d26;
            --border: #2a2e3c;
            --text: #e6e6e6;
            --dim: #9aa0ab;
            --accent: #e8703a;
        }
        body{
            background: var(--bg);
            color: var(--text);
            display: flex; height: 100vh
        }
        aside {
            width: 260px;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            padding: 1rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <aside>

        <h1>chat with your notes</h1>
        <div id="status">Checking..</div>

        <h2>document</h2>
    <input type="file" id="fileInput" accept=".pdf,.txt,.md"/>
    <div id="currentFile">no doc uploaded</div>
        <button id="clearBtn" >clear chat</button>
    </aside>

    <main>
<div class="chat" id="chat">
<div id="emptyState">upload a document in the sidebar</div>
</div>

    <div class="composer">
<input type="text" id="question" placeholder="ask"/>
<button id="sendBtn" disabled>Send</button>
    </div>

    </main>



    












    <script>
        const chatEl = document.getElementById('chat');
        let indexReady = false;
        async function refreshStatus(){
        
            const d = await fetch('/api/status').then(r => r.json());
            indexReady = d.index_ready;
            const box = document.getElementById('statusBox');
            if (!d.groq_key_set){
                box.textContent= 'no groq api set';
            } else if (!d.index_ready){
                box.textContent = 'upload doc to start'
            } else {
                box.textContent = 'index ready';

            }

            document.getElementById('currentFile').textContent = d.curr_file ? `${d.curr_file}`: 'no doc uploaded';

            document.getElementById('sendBtn').disabled = !d.index_ready;

        }
        document.getElementById('fileInput').addEventListener('change', async (e)=> {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('currentFile').textContent = 'uploading and indexing';
            const fd = new FormData();
            fd.append('file', file);
            const res = await fetch('/api/upload', {method: 'POST',body: fd });
            if (!res.ok){
                const err = await res.json().catch(()=> ({}));
                alert(err.detail);
            } 
            e.target.value = '';
            await refreshStatus();

        });

        document.getElementById('clearBtn').addEventListener('click', ()=> {
            chatEl.innerHTML = '';
            chatEl.appendChild(document.getElementById('emptyState'));
        });




        function escapeHtml(s){
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function renderMarkdown(text){
            let html = escapeHtml(text);
            const blocks = [];
            html = html.replace(/```([\s\S]*?)```/g, (_, code) => {
                blocks.push(`<pre><code>${code.trim()}</code></pre>`);
                return `\x00BLOCK${blocks.length - 1}\x00`;
            });


            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
            const lines = html.split('\n');
            const out = [];
            let inList = false;
            for (const l of lines){
                const m = line.match(/^\s*[-*]\s+(.*)/);
                if (m) {
                    if (!inList) {out.push('<ul>'); inList=true}
                        out.push(`<li>${m[1]}</li>`);
                } else {
                    if (inList) {
                        out.push('</ul>'); inList = false;
                    }
                    out.push(l)
                }

            }
            if (inList) out.push('</ul>');


            return html.replace(/\x00BLOCK(\d+)\x00/g, (_, i) => blocks[i]);
        }




        function addMsg(role, txt){
            document.getElementById('emptyState').remove();

            const div = document.createElement('div');
            div.className = 'msg' + role;
            div.innerHTML = `<div> ${role === 'user' ? 'you': 'bot'}</div>
            <div></div>`;
            chatEl.appendChild(div);
            const content = div.querySelector('.content');
            if (txt) content.innerHTML = renderMarkdown(txt);
            chatEl.scrollTop = chat.scrollHeight;
            return content;
        }


        async function sendQuestion(){
            const input = document.getElementById('question');
            const question = input.value.trim();
            if (!question || !indexReady) return;
            input.value = ''
            addMsg('user', question);
            const botContent = addMsg('bot', '');
            

            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question}),
            });


            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buf = '';
            let fullText = '';
            while (true){
                const { done, value} = await reader.read();
                if(done) break;
                buf += decoder.decode(value, {stream: true});
                const events = buf.split('\n\n');
                buf = events.pop();

                    for ( const l of evt.split('\n')){
                        if (line.startsWith('event: ')) eventType = l.slice(7);
                        if (line.startsWith('data: ')) data = line.slice(6);
                    }
                    if (eventType === 'sources'){
                        console.log('sources: ', JSON.parse(data));
                    } else if (eventType !== 'done' && data){
                        fullText += JSON.parse(data);
                        botContent.innerHTML = renderMarkdown(fullText)
                        chatEl.scrollTop = chatEl.scrollHeight;
                    }
                }
            }
        }
        document.getElementById('sendBtn').addEventListener('click', sendQuestion);
        document.getElementById('question').addEventListener('keydown', e => {
            if (e.key === 'Enter') sendQuestion();
        });

        refreshStatus();
    </script>
</body>
</html>
